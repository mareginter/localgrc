[project]
name = "localgrc-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<5.2",
    "psycopg[binary]>=3.1",
    "dj-database-url>=2.1",
    "gunicorn>=21",
    "whitenoise>=6",
    "ollama>=0.4",
    "weasyprint>=61.0",
    "pypdf>=4.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-django>=4.8", "ruff>=0.5", "black>=24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["localgrc*", "apps*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "localgrc.settings"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
