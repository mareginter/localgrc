{% extends "risks/base_risks.html" %}
{% block risks_content %}
<div class="page-header">
  <div><h1>{{ action }}</h1></div>
  <div class="page-actions">
    {% if audit %}<a href="{% url 'audit_detail' audit.pk %}" class="btn btn-neutral">Cancel</a>
    {% elif finding %}<a href="{% url 'finding_detail' finding.pk %}" class="btn btn-neutral">Cancel</a>
    {% else %}<a href="{% url 'audit_list' %}" class="btn btn-neutral">Cancel</a>{% endif %}
  </div>
</div>

<div class="card" style="max-width:600px;">
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div style="margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--c-border);">
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
</div>
{% endblock %}
