{% extends "risks/base_risks.html" %}
{% block risks_content %}
<h1>{{ action }}</h1>
<form method="post" style="max-width:600px;">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" style="padding:0.5rem 1.2rem;">Save</button>
  {% if audit %}<a href="{% url 'audit_detail' audit.pk %}" style="margin-left:1rem;">Cancel</a>
  {% elif finding %}<a href="{% url 'finding_detail' finding.pk %}" style="margin-left:1rem;">Cancel</a>
  {% else %}<a href="{% url 'audit_list' %}" style="margin-left:1rem;">Cancel</a>{% endif %}
</form>
{% endblock %}
