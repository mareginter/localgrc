<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LocalGRC{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      margin: 0;
      padding: 0;
      color: #111827;
      background: #f9fafb;
    }
    h1 { font-size: 1.75rem; margin: 0 0 0.75rem 0; }
    h2 { font-size: 1.15rem; margin: 1.5rem 0 0.75rem 0; }
    h3 { font-size: 1rem; margin: 1rem 0 0.5rem 0; }
    a { color: #2563eb; }
    a:hover { text-decoration: underline; }
    table { font-size: 0.92rem; }
    input[type=text], input[type=password], input[type=email],
    input[type=date], input[type=datetime-local], input[type=number],
    input[type=url], select, textarea {
      padding: 0.45rem 0.6rem;
      font-size: 0.95rem;
      font-family: inherit;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      background: #fff;
    }
    input:focus, select:focus, textarea:focus {
      outline: 2px solid #2563eb;
      outline-offset: -1px;
    }
    button, input[type=submit] {
      padding: 0.45rem 1rem;
      font-size: 0.95rem;
      font-family: inherit;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      background: #2563eb;
      color: #fff;
    }
    button:hover { background: #1d4ed8; }
    .errorlist { color: #b91c1c; list-style: none; padding: 0; }
  </style>
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
