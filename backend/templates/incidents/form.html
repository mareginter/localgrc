{% extends "risks/base_risks.html" %}
{% block risks_content %}
<div class="page-header">
  <div>
    <h1>{{ action }}</h1>
  </div>
  <div class="page-actions">
    {% if incident %}<a href="{% url 'incident_detail' incident.pk %}" class="btn btn-neutral">Cancel</a>
    {% else %}<a href="{% url 'incident_list' %}" class="btn btn-neutral">Cancel</a>{% endif %}
  </div>
</div>

<div class="card" style="max-width:600px;">
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div style="margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--c-border);">
      <button type="submit" class="btn btn-primary">Save incident</button>
    </div>
  </form>
</div>
{% endblock %}
