{% extends "base.html" %}
{% block title %}Login — LocalGRC{% endblock %}
{% block content %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--c-bg);padding:1rem;">
  <div style="width:100%;max-width:400px;">
    
    <div style="text-align:center;margin-bottom:2rem;">
      <div style="width:48px;height:48px;background:var(--c-primary);border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:1.5rem;margin-bottom:1rem;box-shadow:0 4px 12px rgba(37,99,235,0.3);">L</div>
      <h1 style="margin:0;font-size:1.5rem;font-weight:800;color:var(--c-text);">LocalGRC</h1>
      <p class="muted" style="margin-top:0.25rem;font-size:0.9rem;">Governance, Risk & Compliance</p>
    </div>

    <div class="card" style="box-shadow:0 8px 24px rgba(0,0,0,0.06);padding:2rem;">
      {% if form.errors %}
        <div class="message error" style="margin-bottom:1rem;">Invalid credentials. Please try again.</div>
      {% endif %}
      
      <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <div style="margin-bottom:1rem;">
          <label style="display:block;font-weight:500;font-size:0.9rem;margin-bottom:0.25rem;">Email Address</label>
          <input type="email" name="username" required autofocus style="width:100%;">
        </div>
        <div style="margin-bottom:1.5rem;">
          <label style="display:block;font-weight:500;font-size:0.9rem;margin-bottom:0.25rem;">Password</label>
          <input type="password" name="password" required style="width:100%;">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;padding:0.65rem;font-size:0.95rem;">Sign in</button>
      </form>
    </div>
    
    <p style="text-align:center;margin-top:1.5rem;font-size:0.8rem;color:var(--c-text-soft);">
      &copy; {% now "Y" %} LocalGRC. Self-hosted & private.
    </p>
  </div>
</div>
{% endblock %}
