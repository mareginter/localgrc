{% extends "risks/base_risks.html" %}
{% block risks_content %}
<h1>Local AI Assistant</h1>
<p style="color:#666;max-width:720px;">
  Runs entirely on this server via Ollama. Nothing leaves the LAN.
</p>

<div id="health" style="margin:1rem 0;padding:0.6rem 1rem;border-radius:4px;background:#f3f4f6;font-size:0.9rem;">
  Checking model status...
</div>

<div id="chat" style="background:#fff;border:1px solid #e5e7eb;border-radius:8px;display:flex;flex-direction:column;height:70vh;max-width:1100px;">
  <div id="messages" style="flex:1;overflow-y:auto;padding:1.25rem;"></div>
  <form id="chat-form" style="border-top:1px solid #e5e7eb;padding:0.75rem;display:flex;gap:0.5rem;">
    <textarea id="chat-input" rows="2" placeholder="Ask about risks, controls, coverage, incidents..." style="flex:1;resize:none;font-family:inherit;"></textarea>
    <button type="submit" id="send-btn" style="align-self:stretch;">Send</button>
  </form>
</div>

<script>
(function () {
  const healthEl = document.getElementById('health');
  const messagesEl = document.getElementById('messages');
  const form = document.getElementById('chat-form');
  const input = document.getElementById('chat-input');
  const sendBtn = document.getElementById('send-btn');

  const history = [];
  let streaming = false;

  function bubble(role, text) {
    const wrap = document.createElement('div');
    wrap.style.margin = '0.6rem 0';
    wrap.style.display = 'flex';
    wrap.style.justifyContent = role === 'user' ? 'flex-end' : 'flex-start';
    const box = document.createElement('div');
    box.style.maxWidth = '85%';
    box.style.padding = '0.6rem 0.85rem';
    box.style.borderRadius = '8px';
    box.style.whiteSpace = 'pre-wrap';
    box.style.fontSize = '0.92rem';
    box.style.lineHeight = '1.45';
    if (role === 'user') {
      box.style.background = '#2563eb';
      box.style.color = '#fff';
    } else {
      box.style.background = '#f3f4f6';
      box.style.color = '#111';
      box.style.border = '1px solid #e5e7eb';
    }
    box.textContent = text;
    wrap.appendChild(box);
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return box;
  }

  async function checkHealth() {
    try {
      const r = await fetch('{% url "assistant_health" %}');
      const data = await r.json();
      if (!data.available) {
        healthEl.textContent = 'Ollama not reachable at ' + data.host + '. Check docker compose logs ollama.';
        healthEl.style.background = '#fee';
        return;
      }
      if (!data.model_ready) {
        healthEl.innerHTML = 'Ollama is up, but model <code>' + data.configured_model +
          '</code> is not installed. Run:<br><code>docker compose exec ollama ollama pull ' +
          data.configured_model + '</code>';
        healthEl.style.background = '#fef3c7';
        return;
      }
      healthEl.textContent = 'Ready — model ' + data.configured_model + ' (' + data.models_installed.length + ' models installed)';
      healthEl.style.background = '#e7f7e7';
    } catch (e) {
      healthEl.textContent = 'Health check failed: ' + e;
      healthEl.style.background = '#fee';
    }
  }

  form.addEventListener('submit', async function (ev) {
    ev.preventDefault();
    if (streaming) return;
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    input.disabled = true;
    sendBtn.disabled = true;
    streaming = true;

    bubble('user', text);
    const replyBox = bubble('assistant', '');
    let buffer = '';

    try {
      const response = await fetch('{% url "assistant_stream" %}', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': '{{ csrf_token }}',
        },
        body: JSON.stringify({ message: text, history: history.slice(-10) }),
      });
      if (!response.ok || !response.body) {
        replyBox.textContent = 'Error: HTTP ' + response.status;
        return;
      }
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let partial = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        partial += decoder.decode(value, { stream: true });
        const lines = partial.split('\n');
        partial = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const payload = line.slice(6);
          if (payload === '[DONE]') continue;
          try {
            const obj = JSON.parse(payload);
            if (obj.delta) {
              buffer += obj.delta;
              replyBox.textContent = buffer;
              messagesEl.scrollTop = messagesEl.scrollHeight;
            } else if (obj.error) {
              replyBox.textContent = 'Error: ' + obj.error;
            }
          } catch (_) {}
        }
      }
      history.push({ role: 'user', content: text });
      history.push({ role: 'assistant', content: buffer });
    } catch (e) {
      replyBox.textContent = 'Network error: ' + e;
    } finally {
      streaming = false;
      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
    }
  });

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  checkHealth();
})();
</script>
{% endblock %}
