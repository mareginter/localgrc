{% extends "risks/base_risks.html" %}
{% block risks_content %}
<h1>{{ action }}</h1>
<form method="post" style="max-width:600px;">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">Save</button>
  {% if risk %}<a href="{% url 'risk_detail' risk.pk %}" style="margin-left:1rem;">Cancel</a>
  {% else %}<a href="{% url 'risk_list' %}" style="margin-left:1rem;">Cancel</a>{% endif %}
</form>
{% endblock %}
